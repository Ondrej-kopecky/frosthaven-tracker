<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5ba4cf" />
    <meta name="description" content="Frosthaven Tracker — online správa kampaní pro deskovou hru Frosthaven. Sledujte scénáře, postavy, achievementy, crafting a příběh." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Frosthaven Tracker" />
    <meta property="og:description" content="Online správa kampaní pro deskovou hru Frosthaven. Sledujte scénáře, postavy, achievementy a příběh." />
    <meta property="og:url" content="https://frosthaven.ongy.cz/" />
    <meta property="og:image" content="https://frosthaven.ongy.cz/icon-512.svg" />
    <meta property="og:locale" content="cs_CZ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="canonical" href="https://frosthaven.ongy.cz/" />
    <title>Frosthaven Tracker</title>
  </head>
  <body class="bg-gray-950 text-gray-100">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script data-goatcounter="https://frosthaven.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
