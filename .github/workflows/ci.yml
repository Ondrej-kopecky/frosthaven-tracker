name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx vue-tsc --noEmit

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Check dist size
        run: |
          DIST_SIZE=$(du -sb dist | cut -f1)
          DIST_SIZE_MB=$(echo "scale=2; $DIST_SIZE / 1048576" | bc)
          echo "Total dist size: ${DIST_SIZE_MB} MB"
          if [ "$DIST_SIZE" -gt 52428800 ]; then
            echo "::warning::dist size (${DIST_SIZE_MB} MB) exceeds 50 MB threshold"
          fi
