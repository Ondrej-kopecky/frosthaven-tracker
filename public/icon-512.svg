<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 48 48" fill="none">
  <!-- Snowflake / ice crystal favicon for Frosthaven -->
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="50%" stop-color="#5ba4cf"/>
      <stop offset="100%" stop-color="#3a7a9e"/>
    </linearGradient>
    <linearGradient id="glow" x1="24" y1="4" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cce7f0"/>
      <stop offset="100%" stop-color="#5ba4cf"/>
    </linearGradient>
  </defs>
  <!-- Center circle -->
  <circle cx="24" cy="24" r="4" fill="url(#glow)" opacity="0.9"/>
  <!-- Main 6 arms -->
  <g stroke="url(#ice)" stroke-width="2.5" stroke-linecap="round">
    <!-- Vertical -->
    <line x1="24" y1="4" x2="24" y2="44"/>
    <!-- 60deg -->
    <line x1="24" y1="24" x2="41.32" y2="14"/>
    <line x1="24" y1="24" x2="6.68" y2="34"/>
    <!-- 120deg -->
    <line x1="24" y1="24" x2="41.32" y2="34"/>
    <line x1="24" y1="24" x2="6.68" y2="14"/>
  </g>
  <!-- Branch details on each arm -->
  <g stroke="url(#glow)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <!-- Top arm branches -->
    <line x1="24" y1="10" x2="28.5" y2="13.5"/>
    <line x1="24" y1="10" x2="19.5" y2="13.5"/>
    <line x1="24" y1="16" x2="27" y2="18"/>
    <line x1="24" y1="16" x2="21" y2="18"/>
    <!-- Bottom arm branches -->
    <line x1="24" y1="38" x2="28.5" y2="34.5"/>
    <line x1="24" y1="38" x2="19.5" y2="34.5"/>
    <line x1="24" y1="32" x2="27" y2="30"/>
    <line x1="24" y1="32" x2="21" y2="30"/>
    <!-- Upper-right branches -->
    <line x1="35" y1="17.5" x2="34" y2="22"/>
    <line x1="35" y1="17.5" x2="38" y2="20"/>
    <!-- Lower-left branches -->
    <line x1="13" y1="30.5" x2="14" y2="26"/>
    <line x1="13" y1="30.5" x2="10" y2="28"/>
    <!-- Upper-left branches -->
    <line x1="13" y1="17.5" x2="14" y2="22"/>
    <line x1="13" y1="17.5" x2="10" y2="20"/>
    <!-- Lower-right branches -->
    <line x1="35" y1="30.5" x2="34" y2="26"/>
    <line x1="35" y1="30.5" x2="38" y2="28"/>
  </g>
  <!-- Arm tips - small diamonds -->
  <g fill="url(#glow)" opacity="0.9">
    <circle cx="24" cy="4" r="2"/>
    <circle cx="24" cy="44" r="2"/>
    <circle cx="41.32" cy="14" r="2"/>
    <circle cx="6.68" cy="34" r="2"/>
    <circle cx="41.32" cy="34" r="2"/>
    <circle cx="6.68" cy="14" r="2"/>
  </g>
</svg>
